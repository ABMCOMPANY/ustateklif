<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tamİşim Güvenlik Testi — Paket 5</title>
<style>body{font:16px system-ui;background:#0b1418;color:#e7eff2;margin:0;padding:24px}.box{max-width:560px;margin:auto}.card{background:#132026;border:1px solid #25383f;border-radius:16px;padding:18px;margin:14px 0}button{width:100%;padding:15px;border:0;border-radius:12px;font-weight:700;font-size:16px;background:#5cc0d8;color:#06232b}.ok{color:#5ccb98}.bad{color:#ff9b83}.skip{color:#f4b31d}.muted{color:#94a7b0}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="box"><h1>Tamİşim güvenlik testi — Paket 5</h1><p class="muted">Askıya alınmış hesabın yazma/RPC işlemlerini sınar. Test verileri yalnızca saldırı denemesidir.</p><div class="card" id="who">Oturum kontrol ediliyor…</div><button id="run">Paket 5'i çalıştır</button><div id="out"></div></main>
<script>
const cfg=window.USTATEKLIF_CONFIG||{},sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY),out=document.getElementById('out'),who=document.getElementById('who');
function row(name,state,detail){const d=document.createElement('div');d.className='card';const cls=state==='ok'?'ok':state==='skip'?'skip':'bad',txt=state==='ok'?'ENGELLENDİ / GİZLENDİ ✅':state==='skip'?'TEST EDİLEMEDİ ⚠️':'KRİTİK ❌';d.innerHTML='<b>'+name+'</b><p class="'+cls+'">'+txt+'</p><small class="muted"></small>';d.querySelector('small').textContent=detail||'';out.appendChild(d)}
async function ins(name,promise,cleanup){const {data,error}=await promise;if(error){row(name,'ok',error.message);return}row(name,'bad','İşlem kabul edildi');try{if(cleanup)await cleanup(data)}catch(e){}}
(async()=>{const {data:{user}}=await sb.auth.getUser();who.textContent=user?'Oturum: '+user.email:'Oturum bulunamadı.'})();
document.getElementById('run').onclick=async()=>{out.innerHTML='';const {data:{user},error:ue}=await sb.auth.getUser();if(ue||!user){row('Oturum','bad','Askıdaki Uzman B oturumu bulunamadı');return}
const {data:me}=await sb.from('profiles').select('account_status').eq('id',user.id).maybeSingle();if(me?.account_status!=='suspended'){row('Askı durumu','bad','Bu hesap suspended görünmüyor: '+(me?.account_status||'okunamadı'));return}
row('Askı durumu','ok','Hesap suspended; negatif testler başlıyor');

await ins('Askıdayken ilan oluşturma',sb.from('listings').insert({owner:user.id,category:'Güvenlik Testi',problems:['test'],note:'NEGATIVE SECURITY TEST',area:'test',city:'test',district:'test',neighborhood:'test',when_text:'test'}).select('id'),async d=>{if(d?.length)await sb.from('listings').delete().in('id',d.map(x=>x.id))});

const {data:foreign}=await sb.from('listings').select('id,owner,status,chosen_quote').neq('owner',user.id).limit(30);
const open=foreign?.find(x=>x.status==='open'),chosen=foreign?.find(x=>x.status==='chosen'||x.status==='done');
if(open) await ins('Askıdayken teklif gönderme',sb.from('quotes').insert({listing_id:open.id,pro:user.id,price:987654321,eta:'test',note:'NEGATIVE SECURITY TEST'}).select('id'),async d=>{if(d?.length)await sb.from('quotes').delete().in('id',d.map(x=>x.id))}); else row('Askıdayken teklif gönderme','skip','Açık yabancı ilan görünmedi');

if(chosen) await ins('Askıdayken mesaj gönderme',sb.from('messages').insert({listing_id:chosen.id,sender:user.id,body:'NEGATIVE SECURITY TEST'}).select('id'),async d=>{if(d?.length)await sb.from('messages').delete().in('id',d.map(x=>x.id))}); else row('Askıdayken mesaj gönderme','skip','Seçili yabancı ilan görünmedi');

const target=foreign?.[0]?.owner;
if(target){
 await ins('Askıdayken kullanıcı engelleme',sb.from('user_blocks').insert({blocker_id:user.id,blocked_id:target}).select('blocker_id,blocked_id'),async d=>{if(d?.length)await sb.from('user_blocks').delete().eq('blocker_id',user.id).eq('blocked_id',target)});
 await ins('Askıdayken rapor oluşturma',sb.from('reports').insert({reporter_id:user.id,reported_id:target,reason:'NEGATIVE SECURITY TEST'}).select('id'),async d=>{if(d?.length)await sb.from('reports').delete().in('id',d.map(x=>x.id))});
}else{row('Askıdayken kullanıcı engelleme','skip','Hedef kullanıcı bulunamadı');row('Askıdayken rapor oluşturma','skip','Hedef kullanıcı bulunamadı')}

const {error:ce}=await sb.rpc('complete_listing',{p_listing_id:999999999,p_rating:5});row('Askıdayken complete_listing RPC',ce?'ok':'bad',ce?ce.message:'RPC kabul edildi');

const {error:se}=await sb.rpc('sync_my_verification');row('Askıdayken doğrulama senkronizasyonu',se?'ok':'bad',se?se.message:'RPC kabul edildi');
};
</script></body></html>
