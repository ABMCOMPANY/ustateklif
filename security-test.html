<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tamİşim Güvenlik Testi</title>
<style>body{font:16px system-ui;background:#0b1418;color:#e7eff2;margin:0;padding:24px}.box{max-width:560px;margin:auto}.card{background:#132026;border:1px solid #25383f;border-radius:16px;padding:18px;margin:14px 0}button{width:100%;padding:15px;border:0;border-radius:12px;font-weight:700;font-size:16px;background:#5cc0d8;color:#06232b}.ok{color:#5ccb98}.bad{color:#ff9b83}.skip{color:#f4b31d}.muted{color:#94a7b0}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="box"><h1>Tamİşim güvenlik testi — Paket 2</h1><p class="muted">Uzman B oturumuyla yetkisiz okuma/yazma girişimlerini sınar. Test kayıtları yalnız başarısız olması beklenen isteklerdir.</p><div class="card" id="who">Oturum kontrol ediliyor…</div><button id="run">Paket 2'yi çalıştır</button><div id="out"></div></main>
<script>
const cfg=window.USTATEKLIF_CONFIG||{},sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY),out=document.getElementById('out'),who=document.getElementById('who');
function row(name,state,detail){const d=document.createElement('div');d.className='card';const cls=state==='ok'?'ok':state==='skip'?'skip':'bad',txt=state==='ok'?'ENGELLENDİ / GİZLENDİ ✅':state==='skip'?'TEST EDİLEMEDİ ⚠️':'KRİTİK ❌';d.innerHTML='<b>'+name+'</b><p class="'+cls+'">'+txt+'</p><small class="muted"></small>';d.querySelector('small').textContent=detail||'';out.appendChild(d)}
(async()=>{const {data:{user}}=await sb.auth.getUser();who.textContent=user?'Oturum: '+user.email:'Oturum bulunamadı.'})();
document.getElementById('run').onclick=async()=>{out.innerHTML='';const {data:{user},error:ue}=await sb.auth.getUser();if(ue||!user){row('Oturum','bad','Uzman B oturumu bulunamadı');return}
const {data:foreign,error:fe}=await sb.from('listings').select('id,owner,status').neq('owner',user.id).limit(20);
if(fe||!foreign?.length){row('Test ilanı bulma','skip',fe?.message||'Başkasına ait ilan bulunamadı');return}
const chosen=foreign.find(x=>x.status==='chosen'),open=foreign.find(x=>x.status==='open');

// Başkası adına teklif: pro alanı ilan sahibine zorlanır. RLS reddetmeli.
if(open){const {error}=await sb.from('quotes').insert({listing_id:open.id,pro:open.owner,price:987654321,eta:'Güvenlik testi',note:'NEGATIVE SECURITY TEST'});row('Başkası adına sahte teklif','ok'===(!error?'bad':'ok')?'ok':'bad',error?error.message:'INSERT kabul edildi');}
else row('Başkası adına sahte teklif','skip','Açık yabancı ilan yok');

// Seçilmemiş açık işe mesaj. RLS reddetmeli.
if(open){const {error}=await sb.from('messages').insert({listing_id:open.id,sender:user.id,body:'NEGATIVE SECURITY TEST'});row('Seçilmemiş işe mesaj','ok'===(!error?'bad':'ok')?'ok':'bad',error?error.message:'Mesaj INSERT kabul edildi');}
else row('Seçilmemiş işe mesaj','skip','Açık yabancı ilan yok');

// Sahte bildirim. Yetki reddetmeli.
const {error:ne}=await sb.from('notifications').insert({user_id:user.id,type:'test',title:'NEGATIVE SECURITY TEST',body:'NEGATIVE SECURITY TEST'});row('Sahte bildirim üretme',ne?'ok':'bad',ne?ne.message:'Bildirim INSERT kabul edildi');

// Başka kullanıcının profil doğrulamasını değiştirme.
const other=foreign[0].owner;const {data:op,error:ope}=await sb.from('profiles').select('identity_verified').eq('id',other).single();
if(ope)row('Başkasının profilini değiştirme','ok',ope.message);else{const {error}=await sb.from('profiles').update({name:'NEGATIVE SECURITY TEST'}).eq('id',other);row('Başkasının profilini değiştirme',error?'ok':'bad',error?error.message:'UPDATE isteği hata vermedi');}

// Mesaj okuma: yalnızca seçili iş dışındaki mesajların sızıp sızmadığını kontrol et.
// RLS yüzünden görünmeyen kayıtlar 0 satır döner; mevcut seçili iş hariç tutulur.
let q=sb.from('messages').select('id,listing_id').limit(20);if(chosen)q=q.neq('listing_id',chosen.id);const {data:ms,error:me}=await q;
row('Yetkisiz mesaj okuma',me?'ok':(ms&&ms.length?'bad':'ok'),me?me.message:(ms&&ms.length?'Yetkisiz olabilecek mesaj satırı göründü':'Yetkisiz mesaj satırı görünmedi'));
};
</script></body></html>
