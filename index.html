<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F7F9FC; --surface:#FFFFFF; --ink:#102A56; --muted:#6B7C93; --line:#E2E8F0;
  --petrol:#1457D9; --petrol-ink:#FFFFFF; --stub:#1457D9; --tint:#EAF2FF; --focus:#1457D9;
  --amber:#2F80ED; --amber-ink:#FFFFFF; --amber-bg:#EAF2FF; --amber-fg:#1457D9;
  --good:#1D7448; --good-bg:#D9F0E4; --err-bg:#FBE0D8; --err-fg:#7A2410;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1418; --surface:#132026; --ink:#E7EFF2; --muted:#94A7B0; --line:#25383F;
    --petrol:#5CC0D8; --petrol-ink:#06232B; --stub:#1A3A45; --tint:#183039; --focus:#F4B31D;
    --amber-bg:#4A3A0E; --amber-fg:#FFE08A; --good:#5CCB98; --good-bg:#12362A; --err-bg:#4A1F14; --err-fg:#FFC3B0;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1418; --surface:#132026; --ink:#E7EFF2; --muted:#94A7B0; --line:#25383F;
  --petrol:#5CC0D8; --petrol-ink:#06232B; --stub:#1A3A45; --tint:#183039; --focus:#F4B31D;
  --amber-bg:#4A3A0E; --amber-fg:#FFE08A; --good:#5CCB98; --good-bg:#12362A; --err-bg:#4A1F14; --err-fg:#FFC3B0;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px 48px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{font:800 22px "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.01em}
.brand i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);margin-left:3px}
.hdr-r{display:flex;align-items:center;gap:10px}
.notifbtn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}.notifbadge{position:absolute;right:-4px;top:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--amber);color:var(--amber-ink);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}.notif{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.notif.unread{border-left:4px solid var(--amber)}.notif h3{font-size:16px;margin-bottom:3px}.notif p{margin:0;color:var(--muted);font-size:14px}.notifmeta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--amber);color:var(--amber-ink);border:0;font-weight:800;font-size:16px;cursor:pointer}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--petrol);color:var(--petrol-ink)}
.seg.small button{padding:5px 12px;font-size:13px;min-height:32px}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:24px 0 4px;flex-wrap:wrap}
.pagehead h1{font-size:30px;font-weight:800}
.lede{margin:4px 0 8px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 4px;flex-wrap:wrap}
.row h2{font-size:20px}
.count{display:inline-block;min-width:24px;text-align:center;padding:0 8px;border-radius:999px;background:var(--amber);color:var(--amber-ink);font:700 14px Figtree,sans-serif;margin-left:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--amber);color:var(--amber-ink);font-weight:700;cursor:pointer}
.btn.sm{min-height:40px;padding:0 16px;font-size:15px}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:8px 0;color:var(--petrol);font-weight:600;cursor:pointer;margin-top:12px}

.ticket{position:relative;display:grid;grid-template-columns:76px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:12px 0}
.ticket::before,.ticket::after{content:"";position:absolute;left:67px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.stub{background:var(--stub);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 6px;border-right:2px dashed rgba(255,255,255,.4);text-align:center}
.stub .ico{font-size:28px;line-height:1}
.stub .kn{font-size:12px;font-weight:600}
.tbody{padding:14px 16px;min-width:0}
.tbody h3{font-size:18px;font-weight:600;margin-bottom:4px}
.stretch{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.stretch::after{content:"";position:absolute;inset:0}
.stretch:focus-visible{outline:none}
.stretch:focus-visible::after{outline:3px solid var(--focus);outline-offset:-3px;border-radius:16px}
.note{margin:0 0 8px;color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px;color:var(--muted)}
.meta .pill{margin-left:auto}
.foot{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:14px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--tint);color:var(--ink)}
.pill.amber{background:var(--amber-bg);color:var(--amber-fg)}
.pill.good{background:var(--good-bg);color:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--amber);display:inline-block;animation:pulse 1.4s ease-in-out infinite}
.dot.sm{width:8px;height:8px}
@keyframes pulse{50%{opacity:.3}}

.empty,.wait{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:22px 18px;margin:16px 0;color:var(--muted);display:flex;gap:12px;align-items:center}
.err{background:var(--err-bg);color:var(--err-fg);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:15px}
.info{background:var(--good-bg);color:var(--good);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:15px}

.field{margin:28px 0}
.field h2{font-size:20px;margin-bottom:4px}
.hint{margin:0 0 12px;color:var(--muted);font-size:15px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;margin-top:12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;min-height:88px}
.cat .ico{font-size:28px;line-height:1}
.cat[aria-pressed="true"]{border-color:var(--petrol);background:var(--tint);box-shadow:inset 0 0 0 1px var(--petrol)}
.catresults{margin-top:14px}.catgroup{margin-top:18px}.catgroup:first-child{margin-top:0}.catgroup h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:700}.catgroup .cats{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:var(--petrol-ink)}
label.lb,span.lb{display:block;font-weight:600;margin:0 0 6px;font-size:15px}
.in{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
textarea.in{min-height:92px;resize:vertical}
.in:focus-visible{outline-offset:0;border-color:var(--focus)}
.two{display:grid;gap:14px}

.quote{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.quote.chosen{border-color:var(--good)}
.quote.dim{opacity:.55}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.qhead h3{font-size:18px;font-weight:600}
.sub{margin:0;color:var(--muted);font-size:14px}
.rating{margin:6px 0 0;font-size:14px}
.star-i{color:var(--amber)}
.pr{text-align:right;flex:none}
.price{font:800 28px "Bricolage Grotesque",Figtree,sans-serif;line-height:1.1}
.qnote{margin:12px 0;font-size:15px}
.procard{margin:12px 0;padding:12px;border-radius:14px;background:var(--tint);border:1px solid var(--line)}
.protop{display:flex;align-items:center;gap:10px}.proavatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--amber);color:var(--amber-ink);font-weight:800;flex:none}
.probio{margin:8px 0 0;font-size:14px;color:var(--muted)}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.checks{display:grid;gap:8px}.check{display:flex;gap:8px;align-items:flex-start}.check b{color:var(--good)}
.photo-picker{display:grid;gap:10px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo-thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--tint);border:1px solid var(--line)}.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}.photo-thumb button{position:absolute;right:5px;top:5px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-weight:800;cursor:pointer}.photo-strip{display:flex;gap:8px;overflow:auto;margin:10px 0 2px;scroll-snap-type:x proximity}.photo-strip img{width:112px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none;scroll-snap-align:start}.photo-strip.detail img{width:168px;height:126px}.uploadbox{display:block;border:1.5px dashed var(--line);background:var(--surface);border-radius:14px;padding:16px;text-align:center;cursor:pointer;font-weight:600}.uploadbox input{position:absolute;opacity:0;pointer-events:none}

.chat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
.chat h2{font-size:18px;margin-bottom:12px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;margin-bottom:12px}
.msgs p{margin:0}
.m{max-width:82%;padding:8px 12px;border-radius:14px;font-size:15px;overflow-wrap:anywhere}
.m.ben{align-self:flex-end;background:var(--petrol);color:var(--petrol-ink)}
.m.usta{align-self:flex-start;background:var(--tint)}
.send{display:flex;gap:8px}
.rate{margin:16px 0;text-align:center}
.rate p{margin:0 0 4px;color:var(--muted)}
.star{font-size:34px;background:none;border:0;color:var(--amber);cursor:pointer;padding:2px 4px;line-height:1}

.tabs{display:flex;gap:6px;margin:18px 0 8px}
.tabs .chip{min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:10;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Tamİşim mobile refresh */

.myjobs{margin-top:28px}.section-kicker{display:block;font-size:11px;font-weight:800;color:#1457D9;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}.jobcount{font-size:12px;color:#7A899E;margin:-7px 0 10px}.jobs-empty,.notif-empty{text-align:center;padding:28px 18px}.jobs-empty>span,.notif-empty>span{display:block;font-size:30px;margin-bottom:7px}.jobs-empty h3,.notif-empty h3{margin:0;color:#263F61}.jobs-empty p,.notif-empty p{color:#7A899E;font-size:13px}.notification-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:12px 0 20px}.notification-head h1{font-size:30px;color:#102A56;margin:3px 0}.notification-head p{margin:0;color:#73849A;font-size:13px}.notification-list{display:grid;gap:10px}.notif-card{display:flex;gap:11px;padding:15px;background:#fff;border:1px solid #E6ECF3;border-radius:18px;box-shadow:none}.notif-card.unread{border-color:#CFE0FF;background:#FBFDFF}.notif-dot{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:#EEF3F9;color:#7D8CA0;display:grid;place-items:center;font-weight:900}.notif-card.unread .notif-dot{background:#1457D9;color:#fff}.notif-content{min-width:0;flex:1}.notif-title{display:flex;justify-content:space-between;gap:10px}.notif-title h3{font-size:14px;color:#213B5D;margin:0}.notif-title span{white-space:nowrap;font-size:10px;color:#8A98AA}.notif-content p{font-size:13px;line-height:1.45;color:#64758C;margin:5px 0}.notif-link{border:0;background:transparent;color:#1457D9;padding:2px 0;font-weight:800;font-size:12px}

  if(m.includes('already registered')||m.includes('already been registered'))return 'Bu e-posta ile zaten kayıt var. Giriş yapmayı dene.';
  if(m.includes('not confirmed'))return 'E-postanı doğrulaman gerekiyor. Gelen kutunu kontrol et.';
  if(m.includes('rate limit')||m.includes('too many'))return 'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.';
  if(m.includes('fetch')||m.includes('network'))return 'Sunucuya ulaşılamadı. İnternetini ve bağlantı ayarını kontrol et.';
  return 'İşlem yapılamadı. Bilgileri kontrol edip tekrar dene.';
}
function errMsg(e){
  const m=(e&&e.message||'').toLowerCase();
  if(e&&e.code==='23505')return 'Bu ilana zaten teklif verdin.';
  if(m.includes('fetch')||m.includes('network'))return 'Bağlantı yok gibi görünüyor. İnternetini kontrol et.';
  if(m.includes('row-level security')||m.includes('permission'))return 'Bu işlem için yetkin yok.';
  return 'Bir sorun oluştu. Tekrar dene.';
}

/* ---------- veri ---------- */
async function refresh(){
  const me=uid();if(!sb||!me)return false;
  const chk=r=>{if(r.error)throw r.error;return r.data||[]};
  const [mine,open,myq]=await Promise.all([
    sb.from('listings').select('*').eq('owner',me).order('created_at',{ascending:false}).then(chk),
    sb.from('listings').select('*').eq('status','open').neq('owner',me).order('created_at',{ascending:false}).limit(100).then(chk),
    sb.from('quotes').select('*').eq('pro',me).then(chk)
  ]);
  const nr=await sb.from('notifications').select('*').eq('user_id',me).order('created_at',{ascending:false}).limit(50);
  const notifications=chk(nr);
  const br=await sb.from('user_blocks').select('blocked_id').eq('blocker_id',me);
  const blocks=chk(br).map(x=>x.blocked_id);
  const mineIds=mine.map(l=>l.id);
  const known=new Set([...mine,...open].map(l=>l.id));
  const extraIds=[...new Set(myq.map(q=>q.listing_id))].filter(i=>!known.has(i));
  const openIds=open.map(l=>l.id);
  const [qMine,extra,cnt]=await Promise.all([
    mineIds.length?sb.from('quotes').select('*').in('listing_id',mineIds).then(chk):[],
    extraIds.length?sb.from('listings').select('*').in('id',extraIds).then(chk):[],
    openIds.length?sb.from('quote_counts').select('*').in('listing_id',openIds).then(chk):[]
  ]);
  const listings={};[...mine,...open,...extra].forEach(l=>{listings[l.id]=l});
  const quotes={};[...qMine,...myq].forEach(q=>{quotes[q.id]=q});
  const counts={};cnt.forEach(c=>{counts[c.listing_id]=c.n});
  const pids=new Set([me]);
  Object.values(quotes).forEach(q=>pids.add(q.pro));
  Object.values(listings).forEach(l=>pids.add(l.owner));
  const ids=[...pids];
  const partyIds=Object.values(listings).filter(l=>l.status!=='open'&&(l.owner===me||(quotes[l.chosen_quote]&&quotes[l.chosen_quote].pro===me))).map(l=>l.id);
  const listingIds=Object.keys(listings).map(Number);
  const [pr,st,ms,ph]=await Promise.all([
    sb.from('profiles').select('id,name,title,bio,services,service_areas,service_city,service_districts,phone_verified,identity_verified,account_status,created_at').in('id',ids).then(chk),
    sb.from('pro_stats').select('*').in('pro_id',ids).then(chk),
    partyIds.length?sb.from('messages').select('*').in('listing_id',partyIds).order('created_at').then(chk):[],
    listingIds.length?sb.from('listing_photos').select('id,listing_id,path,sort_order').in('listing_id',listingIds).order('sort_order').then(chk):[]
  ]);
  const photos={};
  if(ph.length){
    const signed=await Promise.all(ph.map(async x=>{const r=await sb.storage.from('listing-photos').createSignedUrl(x.path,3600);return {...x,url:r.data&&r.data.signedUrl||''}}));
    signed.filter(x=>x.url).forEach(x=>{(photos[x.listing_id]=photos[x.listing_id]||[]).push(x)});
  }
  const profiles={};pr.forEach(p=>{profiles[p.id]=p});
  const stats={};st.forEach(s=>{stats[s.pro_id]=s});
  const msgs={};ms.forEach(m=>{(msgs[m.listing_id]=msgs[m.listing_id]||[]).push(m)});
  const sig=JSON.stringify({listings,quotes,counts,profiles,stats,msgs,notifications,photos:Object.fromEntries(Object.entries(photos).map(([k,v])=>[k,v.map(x=>x.path)]))});
  const changed=sig!==D.sig;
  if(D.qMine!==undefined&&qMine.length>D.qMine)toast('Yeni teklif geldi');
  D={listings,mine,open,quotes,counts,profiles,stats,msgs,photos,notifications,blocks,sig,qMine:qMine.length};
  if(profiles[me])S.profile=profiles[me];
  return changed;
}
async function boot(){
  S.loading=true;render();
  try{await refresh();const ar=await sb.rpc('is_admin');S.isAdmin=!ar.error&&ar.data===true}catch(e){console.error(e);toast(errMsg(e))}
  S.loading=false;render();subscribe();
}
let kickT;
function kick(){
  clearTimeout(kickT);
  kickT=setTimeout(async()=>{
    if(!S.user||S.busy)return;
    try{if(await refresh())render()}catch(e){console.error(e)}
  },400);
}
let chan=null;
function subscribe(){
  if(!sb||!S.user)return;
  try{
    if(chan)sb.removeChannel(chan);
    chan=sb.channel('ut-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'listings'},kick)
      .on('postgres_changes',{event:'*',schema:'public',table:'quotes'},kick)
      .on('postgres_changes',{event:'*',schema:'public',table:'messages'},kick)
      .on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:`user_id=eq.${uid()}`},kick)
      .subscribe();
  }catch(e){console.error(e)}
}
function unsubscribe(){try{if(chan&&sb)sb.removeChannel(chan)}catch(e){}chan=null}

function vDetail(){
  const l=D.listings[S.sel];
  if(!l){S.view='list';return vList()}
  const all=qsOf(l.id),n=all.length;
  let h=`<button class="link" data-a="back">İlanlarıma dön</button>`+ticket(l,{pill:pillMine(l)});
  h+=`<div class="row"><h2>Gelen teklifler<span class="count">${n}</span></h2>`+
    (l.status==='open'&&n>1?`<div class="seg small" role="group" aria-label="Sırala"><button data-a="sort" data-v="fiyat" aria-pressed="${S.sort==='fiyat'}">En ucuz</button><button data-a="sort" data-v="puan" aria-pressed="${S.sort==='puan'}">En yüksek puan</button></div>`:'')+`</div>`;
  if(!n)h+='<div class="wait"><span class="dot"></span>Uzmanlar ilanını inceliyor. Teklifler gelince burada görünecek.</div>';
  const rt=q=>Number(stat(q.pro).rating)||0;
  const rest=all.filter(q=>q.id!==l.chosen_quote).sort(S.sort==='puan'?(a,b)=>rt(b)-rt(a):(a,b)=>a.price-b.price);
  const ch=chosenQ(l);
  h+=(ch?[ch,...rest]:rest).map(q=>{
    const chosen=l.chosen_quote===q.id,dim=l.chosen_quote&&!chosen;
    const p=prof(q.pro),s=stat(q.pro);
    const rating=s.rating!=null?`<span class="star-i">★</span> ${Number(s.rating).toFixed(1)} <span class="muted">(${s.jobs} iş)</span>`:'<span class="muted">Yeni uzman, henüz puanı yok</span>';
    return `<article class="quote ${chosen?'chosen':''} ${dim?'dim':''}">
      <div class="qhead"><div><h3>${esc(p.name)}</h3><p class="sub">${esc(p.title||'Servis ve tamir')}</p><p class="rating">${rating}</p></div>
      <div class="pr"><div class="price">${tl(q.price)}</div><div class="muted small">${esc(q.eta)}</div></div></div>
      ${q.note?`<p class="qnote">${esc(q.note)}</p>`:''}
      ${proCard(q.pro)}
      ${chosen?'<span class="pill good">Seçildi</span>':(l.status==='open'?`<button class="btn block" data-a="pick" data-v="${q.id}">Bu teklifi seç</button>`:'')}
    </article>`;
  }).join('');
  if(ch){
    h+=chatBox(l,prof(ch.pro).name,l.status==='chosen');
    if(l.status==='chosen')h+=`<div class="rate"><p>İş bittiyse uzmanı puanla</p><div>${[1,2,3,4,5].map(i=>`<button class="star" data-a="rate" data-v="${i}" aria-label="${i} yıldız">★</button>`).join('')}</div></div>`;
    else h+=`<p class="rate"><span class="pill good">Tamamlandı. Puanın: ${'★'.repeat(l.rating||0)}${'☆'.repeat(5-(l.rating||0))}</span></p>`;
  }
  return h;
}

async function run(a,v,el){
  const f=A[a];if(!f)return;
  if(NET.has(a)){if(S.busy)return;S.busy=true;document.body.style.cursor='progress'}
  try{await f(v)}catch(e){console.error(e);toast(a==='authGo'?authMsg(e):errMsg(e))}
  finally{S.busy=false;document.body.style.cursor=''}
  render();
  if(a==='send'){const c=$('#chat-input');c&&c.focus({preventScroll:true})}
  else if(KEEP.has(a)&&el){
    const again=[...document.querySelectorAll('[data-a]')].find(x=>x.dataset.a===a&&x.dataset.v===v);
    if(again)again.focus({preventScroll:true});
  }
  if(!KEEP.has(a))window.scrollTo({top:0});
}

  window.addEventListener('load',async()=>{
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('tamisim-')).map(k=>caches.delete(k)));
      }
    }catch(e){}
  });
}
})();
</script>
