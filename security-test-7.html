<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="tamisim-security-version" content="20"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>Tamİşim Güvenlik Testi — Paket 10 v22</title><style>body{font:16px system-ui;background:#0b1418;color:#e7eff2;margin:0;padding:24px}.box{max-width:560px;margin:auto}.card{background:#132026;border:1px solid #25383f;border-radius:16px;padding:18px;margin:14px 0}button{width:100%;padding:15px;border:0;border-radius:12px;font-weight:700;font-size:16px;background:#5cc0d8;color:#06232b}.ok{color:#5ccb98}.bad{color:#ff9b83}.skip{color:#f4b31d}.allow{color:#5cc0d8}.muted{color:#94a7b0}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="box"><h1>Tamİşim güvenlik testi — Paket 10 v22</h1><p class="muted">Yetkisiz özel veri ile normal açık-ilan fotoğraf erişimini birbirinden ayırır.</p><div class="card" id="who">Oturum kontrol ediliyor…</div><button id="run">Paket 10 v22'yi çalıştır</button><div id="out"></div></main><script>
const cfg=window.USTATEKLIF_CONFIG||{},sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY),out=document.getElementById('out'),who=document.getElementById('who');
function row(n,s,d){const x=document.createElement('div');x.className='card';const map={ok:['ok','ENGELLENDİ / GİZLENDİ ✅'],bad:['bad','KRİTİK ❌'],skip:['skip','TEST EDİLEMEDİ ⚠️'],allow:['allow','BEKLENEN ERİŞİM ✅']},m=map[s];x.innerHTML='<b>'+n+'</b><p class="'+m[0]+'">'+m[1]+'</p><small class="muted"></small>';x.querySelector('small').textContent=d||'';out.appendChild(x)}
(async()=>{const {data:{user}}=await sb.auth.getUser();who.textContent=user?'Oturum: '+user.email:'Oturum bulunamadı.'})();
document.getElementById('run').onclick=async()=>{out.innerHTML='';const {data:{user}}=await sb.auth.getUser();if(!user){row('Oturum','bad','Normal kullanıcı oturumu yok');return}
const {data:others}=await sb.from('profiles').select('id').neq('id',user.id).limit(20);const ids=(others||[]).map(x=>x.id);if(!ids.length){row('Hedef kullanıcı','skip','Başka kullanıcı bulunamadı');return}
let {data,error}=await sb.from('notifications').select('id,user_id,title,body').in('user_id',ids).limit(20);row('Başkasının bildirimlerini okuma',error||!data?.length?'ok':'bad',error?error.message:(!data?.length?'Yabancı bildirim görünmedi':data.length+' yabancı bildirim görüldü'));
({data,error}=await sb.from('messages').select('id,listing_id,sender,body').neq('sender',user.id).limit(100));let leaked=[];for(const m of data||[]){const {data:party}=await sb.rpc('can_message_listing',{p_listing_id:m.listing_id});if(!party)leaked.push(m)}row('Taraf olmadığı mesajları okuma',error||!leaked.length?'ok':'bad',error?error.message:(!leaked.length?'Yetkisiz mesaj görünmedi':leaked.length+' yetkisiz mesaj görüldü'));
({data,error}=await sb.from('quotes').select('id,listing_id,pro,price,note').limit(100));let qleak=[];for(const q of data||[]){if(q.pro===user.id)continue;const {data:l}=await sb.from('listings').select('owner').eq('id',q.listing_id).maybeSingle();if(!l||l.owner!==user.id)qleak.push(q)}row('Başkasının teklif detaylarını okuma',error||!qleak.length?'ok':'bad',error?error.message:(!qleak.length?'Yetkisiz teklif görünmedi':qleak.length+' yetkisiz teklif görüldü'));

// Açık yabancı ilan fotoğrafı, ürün işlevinin parçası olarak görünür olabilir.
const {data:openListings}=await sb.from('listings').select('id,owner,status').neq('owner',user.id).eq('status','open').limit(50);
const openIds=(openListings||[]).map(x=>x.id);
if(openIds.length){const r=await sb.from('listing_photos').select('listing_id,owner,path').in('listing_id',openIds).limit(10);row('Açık ilan fotoğraf metadata erişimi',r.error?'bad':(r.data?.length?'allow':'skip'),r.error?r.error.message:(r.data?.length?'Açık ilan için '+r.data.length+' fotoğraf kaydı erişilebilir':'Açık yabancı ilanda fotoğraf kaydı yok'))}else row('Açık ilan fotoğraf metadata erişimi','skip','Açık yabancı ilan yok');

// Açık olmayan ve tarafı olunmayan yabancı ilanların fotoğraf metadata'sı görünmemeli.
const {data:closed}=await sb.from('listings').select('id,owner,status').neq('owner',user.id).neq('status','open').limit(100);let unauthorizedIds=[];
for(const l of closed||[]){const {data:party}=await sb.rpc('can_message_listing',{p_listing_id:l.id});if(!party)unauthorizedIds.push(l.id)}
if(!unauthorizedIds.length) row('Yetkisiz ilan fotoğraf metadata okuma','skip','Test edilecek açık olmayan/yetkisiz yabancı ilan yok');
else {const r=await sb.from('listing_photos').select('listing_id,owner,path').in('listing_id',unauthorizedIds).limit(20);row('Yetkisiz ilan fotoğraf metadata okuma',r.error||!r.data?.length?'ok':'bad',r.error?r.error.message:(!r.data?.length?'Yetkisiz fotoğraf yolu görünmedi':r.data.length+' yetkisiz fotoğraf yolu görüldü'))}

// Kök listeleme bir güvenlik kararı değildir: erişilebilen açık ilan klasörleri RLS nedeniyle listede görünebilir.
// Bunun yerine bilinen yetkisiz listing path'ini doğrudan listelemeyi deneriz.
if(!unauthorizedIds.length) row('Yetkisiz Storage klasörü listeleme','skip','Test edilecek yetkisiz ilan ID yok');
else {let bad=0,detail='';for(const lid of unauthorizedIds.slice(0,10)){const owner=(closed||[]).find(x=>x.id===lid)?.owner;if(!owner)continue;const r=await sb.storage.from('listing-photos').list(owner+'/'+lid,{limit:10});if(r.error){detail=r.error.message;continue}if(r.data?.length)bad+=r.data.length}row('Yetkisiz Storage klasörü listeleme',bad?'bad':'ok',bad?bad+' yetkisiz nesne görüldü':(detail||'Yetkisiz klasörde nesne görünmedi'))}
// v17: Sunucu tarafı fotoğraf yetki kararını doğrudan doğrula.
let denied=0, allowed=0, checked=0;
const {data:allForeign}=await sb.from('listings').select('id,owner,status').neq('owner',user.id).limit(100);
for(const l of allForeign||[]){
  const {data:can,error:e}=await sb.rpc('can_view_listing_photo',{p_listing_id:l.id});
  if(e) continue;
  checked++;
  if(can) allowed++; else denied++;
}
row('v17 fotoğraf yetki kararı',checked?(denied?'ok':'allow'):'skip',checked?('Kontrol edilen: '+checked+' · izinli: '+allowed+' · reddedilen: '+denied):'Kontrol edilecek yabancı ilan yok');


// Paket 8: istemcinin değiştirmemesi gereken alanlar + yönetici listesi gizliliği.
let r=await sb.from('profiles').update({account_status:'active'}).eq('id',user.id).select('id');
row('Kendi hesap durumunu değiştirme',r.error||!r.data?.length?'ok':'bad',r.error?r.error.message:(!r.data?.length?'0 satır güncellendi':'Hassas alan değiştirilebildi'));

r=await sb.from('profiles').update({identity_verified:true}).eq('id',user.id).select('id');
row('Kendi kimlik rozetini verme',r.error||!r.data?.length?'ok':'bad',r.error?r.error.message:(!r.data?.length?'0 satır güncellendi':'Kimlik doğrulaması değiştirilebildi'));

r=await sb.from('profiles').update({phone_verified:true}).eq('id',user.id).select('id');
row('Kendi telefon rozetini verme',r.error||!r.data?.length?'ok':'bad',r.error?r.error.message:(!r.data?.length?'0 satır güncellendi':'Telefon doğrulaması değiştirilebildi'));

r=await sb.from('admin_users').select('user_id').limit(20);
row('Yönetici listesini okuma',r.error||!r.data?.length?'ok':'bad',r.error?r.error.message:(!r.data?.length?'Yönetici kaydı görünmedi':r.data.length+' yönetici kaydı görüldü'));

r=await sb.from('profiles').delete().in('id',ids).select('id');
row('Başkasının profilini silme',r.error||!r.data?.length?'ok':'bad',r.error?r.error.message:(!r.data?.length?'RLS nedeniyle 0 satır silindi':r.data.length+' profil silindi'));


// Paket 9: doğrudan iş-akışı manipülasyonu ve sahiplik saldırıları.
let p9=await sb.from('listings').update({status:'done'}).neq('owner',user.id).select('id');
row('Başkasının ilan durumunu değiştirme',p9.error||!p9.data?.length?'ok':'bad',p9.error?p9.error.message:(!p9.data?.length?'0 satır güncellendi':p9.data.length+' ilan değiştirildi'));

p9=await sb.from('listings').update({chosen_quote:999999999}).neq('owner',user.id).select('id');
row('Başkasının seçili teklifini değiştirme',p9.error||!p9.data?.length?'ok':'bad',p9.error?p9.error.message:(!p9.data?.length?'0 satır güncellendi':p9.data.length+' ilan değiştirildi'));

p9=await sb.from('quotes').delete().neq('pro',user.id).select('id');
row('Başkasının teklifini silme',p9.error||!p9.data?.length?'ok':'bad',p9.error?p9.error.message:(!p9.data?.length?'0 satır silindi':p9.data.length+' teklif silindi'));

p9=await sb.from('messages').delete().neq('sender',user.id).select('id');
row('Başkasının mesajını silme',p9.error||!p9.data?.length?'ok':'bad',p9.error?p9.error.message:(!p9.data?.length?'0 satır silindi':p9.data.length+' mesaj silindi'));

p9=await sb.from('listing_photos').delete().neq('owner',user.id).select('id');
row('Başkasının fotoğraf kaydını silme',p9.error||!p9.data?.length?'ok':'bad',p9.error?p9.error.message:(!p9.data?.length?'0 satır silindi':p9.data.length+' fotoğraf kaydı silindi'));


// Paket 10: kendi kayıtlarında workflow/sahiplik alanı manipülasyonu.
let p10=await sb.from('quotes').update({price:1,note:'SECURITY_TAMPER'}).eq('pro',user.id).select('id');
row('Kendi teklifini sonradan değiştirme',p10.error||!p10.data?.length?'ok':'bad',p10.error?p10.error.message:(!p10.data?.length?'0 satır güncellendi':p10.data.length+' teklif değiştirildi'));

p10=await sb.from('messages').update({body:'SECURITY_TAMPER'}).eq('sender',user.id).select('id');
row('Gönderilmiş mesajı değiştirme',p10.error||!p10.data?.length?'ok':'bad',p10.error?p10.error.message:(!p10.data?.length?'0 satır güncellendi':p10.data.length+' mesaj değiştirildi'));

p10=await sb.from('listing_photos').update({path:'SECURITY_TAMPER'}).eq('owner',user.id).select('id');
row('Fotoğraf metadata yolunu değiştirme',p10.error||!p10.data?.length?'ok':'bad',p10.error?p10.error.message:(!p10.data?.length?'0 satır güncellendi':p10.data.length+' fotoğraf kaydı değiştirildi'));

p10=await sb.from('user_blocks').update({blocked_id:user.id}).eq('blocker_id',user.id).select('blocker_id,blocked_id');
row('Engel kaydını sonradan değiştirme',p10.error||!p10.data?.length?'ok':'bad',p10.error?p10.error.message:(!p10.data?.length?'0 satır güncellendi':p10.data.length+' engel kaydı değiştirildi'));

p10=await sb.from('reports').update({reason:'SECURITY_TAMPER_12345'}).eq('reporter_id',user.id).select('id');
row('Şikâyet içeriğini sonradan değiştirme',p10.error||!p10.data?.length?'ok':'bad',p10.error?p10.error.message:(!p10.data?.length?'0 satır güncellendi':p10.data.length+' şikâyet değiştirildi'));

};
</script></body></html>
