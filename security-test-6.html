<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tamİşim Güvenlik Testi — Paket 6</title>
<style>body{font:16px system-ui;background:#0b1418;color:#e7eff2;margin:0;padding:24px}.box{max-width:560px;margin:auto}.card{background:#132026;border:1px solid #25383f;border-radius:16px;padding:18px;margin:14px 0}button{width:100%;padding:15px;border:0;border-radius:12px;font-weight:700;font-size:16px;background:#5cc0d8;color:#06232b}.ok{color:#5ccb98}.bad{color:#ff9b83}.skip{color:#f4b31d}.muted{color:#94a7b0}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="box"><h1>Tamİşim güvenlik testi — Paket 6</h1><p class="muted">Aktif normal kullanıcıyla hassas kolon, şikâyet ve yönetici yetkilerini sınar.</p><div class="card" id="who">Oturum kontrol ediliyor…</div><button id="run">Paket 6'yı çalıştır</button><div id="out"></div></main>
<script>
const cfg=window.USTATEKLIF_CONFIG||{},sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY),out=document.getElementById('out'),who=document.getElementById('who');
function row(name,state,detail){const d=document.createElement('div');d.className='card';const cls=state==='ok'?'ok':state==='skip'?'skip':'bad',txt=state==='ok'?'ENGELLENDİ / GİZLENDİ ✅':state==='skip'?'TEST EDİLEMEDİ ⚠️':'KRİTİK ❌';d.innerHTML='<b>'+name+'</b><p class="'+cls+'">'+txt+'</p><small class="muted"></small>';d.querySelector('small').textContent=detail||'';out.appendChild(d)}
document.getElementById('run').onclick=async()=>{out.innerHTML='';const {data:{user}}=await sb.auth.getUser();if(!user){row('Oturum','bad','Normal kullanıcı oturumu yok');return}
const {data:me}=await sb.from('profiles').select('account_status').eq('id',user.id).maybeSingle();if(me?.account_status!=='active'){row('Aktif hesap','bad','Hesap active değil');return}
const {data:others}=await sb.from('profiles').select('id').neq('id',user.id).limit(1);const target=others?.[0]?.id;if(!target){row('Hedef kullanıcı','skip','Başka kullanıcı yok');return}

// Bildirim UPDATE: yalnız read_at değil, güvenilir içerik alanlarını da değiştirmeyi dene.
const {data:ns,error:ne}=await sb.from('notifications').select('id,title,body,type,user_id').eq('user_id',user.id).limit(1);
if(ne||!ns?.length) row('Bildirim içeriğini değiştirme','skip',ne?.message||'Kendi bildirimi yok');
else {const n=ns[0];const {data:u,error:e}=await sb.from('notifications').update({title:'HACKED SECURITY TEST',body:'HACKED',type:'nearby_job'}).eq('id',n.id).select('id');row('Bildirim içeriğini değiştirme',e||!u?.length?'ok':'bad',e?e.message:(!u?.length?'0 satır güncellendi':'Hassas bildirim içeriği değiştirilebildi'));if(!e&&u?.length) await sb.from('notifications').update({title:n.title,body:n.body,type:n.type}).eq('id',n.id)}

// Şikâyette status/created_at sahteciliği.
const {data:r1,error:e1}=await sb.from('reports').insert({reporter_id:user.id,reported_id:target,reason:'NEGATIVE SECURITY TEST REPORT',status:'resolved',created_at:'2000-01-01T00:00:00Z'}).select('id');
row('Şikâyet durum/tarih sahteciliği',e1?'ok':'bad',e1?e1.message:'Sahte status/created_at kabul edildi');

// Başka profili DELETE.
const {data:d1,error:de}=await sb.from('profiles').delete().eq('id',target).select('id');row('Başkasının profilini silme',de||!d1?.length?'ok':'bad',de?de.message:(!d1?.length?'RLS nedeniyle 0 satır silindi':'Profil silme kabul edildi'));

// Admin RPC'leri normal kullanıcıdan.
const tests=[
 ['Yetkisiz kimlik doğrulama RPC',()=>sb.rpc('admin_set_identity',{p_user_id:target,p_verified:true})],
 ['Yetkisiz hesap durumu RPC',()=>sb.rpc('admin_set_account_status',{p_user_id:target,p_status:'suspended'})],
 ['Yetkisiz admin dashboard RPC',()=>sb.rpc('admin_dashboard')]
];
for(const [name,fn] of tests){const {data,error}=await fn();row(name,error||data==null?'ok':'bad',error?error.message:(data==null?'Sonuç gizlendi':'Admin sonucu döndü'))}
};
(async()=>{const {data:{user}}=await sb.auth.getUser();who.textContent=user?'Oturum: '+user.email:'Oturum bulunamadı.'})();
</script></body></html>
